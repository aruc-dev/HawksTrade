# ============================================================
# HawksTrade Configuration
# ============================================================
# Edit this file to control all bot behaviour.
# Mode switch: "paper" or "live"
# ============================================================

# --- TRADING MODE ---
mode: paper          # "paper" = simulation | "live" = real money

# --- SECRETS SOURCE ---
# "local" = load from config/.env or .env (for local dev)
# "shm"   = load from /dev/shm/.hawkstrade.env (for EC2; populated at boot by scripts/fetch_secrets.sh)
# Set HAWKSTRADE_REQUIRE_SHM=1 in production cron/systemd to fail closed if the shm file is unavailable.
secrets_source: shm

# --- ALPACA ENDPOINTS ---
alpaca:
  paper_base_url: "https://paper-api.alpaca.markets"
  live_base_url:  "https://api.alpaca.markets"
  data_base_url:  "https://data.alpaca.markets"
  crypto_data_url: "https://data.alpaca.markets"

# --- INTRADAY TRADING ---
intraday:
  enabled: false           # DISABLED by default. Set true to allow same-day entries & exits.
  # When false, the bot will only enter positions that it intends to hold
  # for at least 1 trading day (swing trades).

# --- GENERAL TRADING PARAMETERS ---
trading:
  max_positions: 10              # Maximum number of open positions at any time (global cap)
  max_crypto_positions: 3        # Max open crypto positions. Set to 0 to disable crypto entries entirely.
  min_crypto_positions: 0        # Reserved slots for crypto — stocks cannot fill these slots.
                                 # Crypto is NOT required to use them; reservation only blocks stocks
                                 # from saturating the portfolio. Set both max and min to 0 to disable crypto.
                                 # Invariant: min_crypto_positions <= max_crypto_positions <= max_positions
  max_position_pct: 0.08         # Max % of portfolio per position (8%)
  stop_loss_pct: 0.035           # Stop-loss at 3.5% below entry
  take_profit_pct: 0.12          # Take-profit at 12% above entry
  daily_loss_limit_pct: 0.05     # Hard stop from first observed account value for the NY trading date
  min_trade_value_usd: 100       # Minimum $ value per trade
  order_type: "limit"            # "market" or "limit"
  limit_slippage_pct: 0.001      # Limit price set 0.1% from current for fast fills
  crypto_correlation_guard:
    enabled: true                # Block new crypto entries that duplicate existing/planned exposure.
    max_correlation: 0.85        # Maximum allowed positive daily-return correlation.
    lookback_days: 30            # Daily bars used for the correlation estimate.
    fail_closed: true            # If correlation data cannot be checked, skip the entry.

# --- ORDER GOVERNOR ---
# Broker-state safety gate evaluated immediately before order submission.
order_governor:
  enabled: true
  max_active_orders: 50
  max_orders_per_window: 60
  order_rate_window_seconds: 60
  max_daily_orders: 500
  max_notional_usd: null
  max_notional_pct: null

# --- BROKER PROTECTIVE STOPS ---
# Keeps broker-side protective sell orders aligned with open trade-log rows.
# In paper mode the sync is log-only by default to avoid accidental test/dev
# order placement. Set submit_in_paper true only for explicit paper-order tests.
broker_stops:
  enabled: true
  submit_in_paper: false
  crypto_stop_limit_offset_pct: 0.005

# --- PROTECTIONS ---
# Entry lock manager. Blocks new entries after recent symbol, strategy, or
# portfolio-level weakness while allowing exits to continue.
# When enabled, failed refreshes block new entries fail-closed while exits continue.
protections:
  enabled: true
  symbol_cooldown_days: 1.0
  symbol_stoploss_cooldown_days: 3.0
  symbol_stoploss_loss_pct: 0.035
  strategy_stoploss_lookback_days: 10.0
  strategy_stoploss_threshold: 3
  strategy_stoploss_cooldown_days: 3.0
  low_profit_lookback_days: 20.0
  low_profit_min_trades: 5
  low_profit_threshold_pct: 0.0
  low_profit_cooldown_days: 5.0
  max_drawdown_lookback_days: 20.0
  max_drawdown_pct: 0.05
  max_drawdown_cooldown_days: 5.0

# --- STOCK UNIVERSE ---
stocks:
  scan_universe:                 # Stocks screened for opportunities each cycle
    - SPY
    - QQQ
    - XLK
    - SMH
    - IGV
    - XLF
    - KRE
    - EEM
    - EFA
    - IBIT
    - BITO
    - AAPL
    - MSFT
    - GOOGL
    - AMZN
    - NVDA
    - AVGO
    - TSM
    - ORCL
    - TSLA
    - AMD
    - MRVL
    - MU
    - INTC
    - ARM
    - LRCX
    - AMAT
    - UBER
    - JPM
    - GS
    - COIN
    - FCX
    - ETN
    - VRT
    - PANW
    - CRWD

# --- DYNAMIC UNIVERSE SCREENER ---
screener:
  enabled: true                   # Set true to enable dynamic screening (increases API usage vs static list)
  min_adv_shares: 1000000          # Min avg daily volume (shares, 20-day)
  min_adv_dollars: 50000000        # Min avg daily dollar volume ($50M/day)
  min_price: 10.0                  # Min share price (filter penny stocks and low-quality churn)
  max_price: 2000.0                # Max share price
  min_atr_pct: 0.012               # Min 14-day ATR as % of price (needs movement)
  max_atr_pct: 0.06                # Max 14-day ATR as % of price (avoid unstable tail risk)
  target_atr_pct: 0.03             # Score candidates closest to moderate volatility
  trend_sma_days: 50               # Prefer symbols above their intermediate trend
  min_trend_sma_ratio: 1.0         # Current close must be at/above SMA trend
  max_trend_sma_ratio: 1.30        # Avoid chasing names stretched >30% above trend
  min_20d_return_pct: -0.05        # Avoid recent breakdowns
  max_20d_return_pct: 0.35         # Avoid blow-off moves
  max_universe: 40                 # Hard cap on dynamic candidates returned
  # The legacy scan_universe (above) is always merged in, so existing symbols
  # are never dropped even if they fail the screener filters.

# --- CRYPTO UNIVERSE ---
crypto:
  regime_filter:
    ema_period: 20
    min_ema_slope_lookback_days: 5
    min_ema_slope_pct: -0.005   # BTC EMA20 may not fall more than 0.5% over 5d.
    min_price_above_ema_pct: 0.0
  scan_universe:
    - BTC/USD
    - ETH/USD
    - SOL/USD
    - LINK/USD
    - XRP/USD
    - ADA/USD
    - AVAX/USD
    - DOGE/USD
    - LTC/USD
    - DOT/USD
    - UNI/USD
    - AAVE/USD

# --- STRATEGIES ---
# Each strategy can be independently enabled/disabled and weighted.
strategies:

  momentum:
    enabled: true
    asset_class: stocks          # stocks | crypto | both
    description: "Adaptive momentum: top-2 green-regime ranking with a 4% momentum floor, optional ATR-scaled momentum gate, reduced ATR stop extension, 1% risk sizing, sector-neutral ranking, breadth coverage guard, breadth-tiered regime, and time-of-day normalized volume-pace entry"
    top_n: 2                     # Pick the two strongest sector-diversified momentum stocks in green regimes
    hold_days: 4                 # Minimum hold before profit-aware exit checks
    exit_policy: "profit_trailing" # fixed_hold | profit_trailing | risk_only_baseline
    profit_floor_pct: 0.0        # After hold_days, exit if P&L is flat/negative
    trail_activation_pct: 0.06   # Enable trailing stop once peak gain reaches 6%
    trailing_stop_pct: 0.04      # Exit if price falls 4% from post-entry peak
    max_hold_days: 20            # Cap stale momentum positions even if still green
    min_momentum_pct: 0.04       # Minimum 4% 5-day gain floor to qualify
    min_momentum_atr_mult: 0.0   # Optional volatility gate: require momentum >= max(floor, ATR/price * multiple); 0 disables
    min_alpha_pct: 0.0           # Optional excess 5-day return over SPY; 0 disables this stricter gate
    weight: 1.0                  # Signal weight (relative to other strategies)
    # Phase 1: Volatility-adjusted risk management
    atr_period: 14               # ATR lookback for dynamic stop computation
    atr_multiplier: 1.2          # Stop = entry - atr_multiplier * ATR(14)
    max_stop_loss_pct: 0.05      # Hard cap: Momentum ATR stop cannot be wider than 5% below entry
    risk_per_trade_pct: 0.01     # Risk 1% of total equity per trade (position sizing)
    # Phase 2: Sector-neutral ranking
    max_positions_per_sector: 1  # Max concurrent positions in any single GICS sector
    # Phase 3: Market breadth tiered regime guard
    breadth_green_threshold: 0.50  # >= 50% above SMA50 → Green (full top_n deployed)
    breadth_red_threshold: 0.25    # < 25% above SMA50 → Red (no new entries)
    min_breadth_coverage_pct: 0.65 # Require valid SMA50 coverage for at least 65% of the scan universe
    yellow_max_positions: 1        # Max positions in Yellow regime (breadth 25–50%)
    volume_confirmation_mode: "pace" # "pace" compares current session volume to expected volume for elapsed market minutes; "daily" uses legacy full-day ratio
    volume_pace_ratio: 1.8         # Current session volume pace must exceed this multiple of the 20-day average daily pace
    volume_pace_timeframe: "1Min"  # Intraday bars used to calculate current session volume pace
    session_minutes: 390           # Regular US equity session length used for volume-pace normalization
    volume_spike_ratio: 2.0        # Legacy daily fallback: latest daily volume must exceed this multiple of the 20-day average

  relative_strength:
    enabled: true
    asset_class: stocks
    description: "Medium-term relative-strength momentum: ranks stocks by 20-day excess return versus SPY, requires absolute strength, trend confirmation, volume-pace confirmation, sector-neutral ranking, breadth coverage guard, and ATR-based risk sizing."
    top_n: 1                       # Pick the strongest sector-diversified RS leader in green regimes
    lookback_days: 20              # Rank by this lookback return minus benchmark return
    benchmark_symbol: SPY
    min_rs_pct: 0.05               # Must beat SPY by at least 5% over the lookback window
    min_abs_return_pct: 0.08       # Avoid least-bad picks in broad market weakness
    recent_lookback_days: 3
    max_recent_return_pct: 0.03    # Require RS leadership without a fresh short-term blow-off
    require_price_above_sma: true
    trend_sma_days: 50
    max_trend_extension_pct: 0.30  # Avoid names stretched more than 30% above SMA50
    hold_days: 7
    profit_trailing_enabled: true
    profit_floor_pct: 0.0
    trail_activation_pct: 0.06
    trailing_stop_pct: 0.04
    max_hold_days: 20
    weight: 1.0
    atr_period: 14
    atr_multiplier: 1.2
    max_stop_loss_pct: 0.05
    risk_per_trade_pct: 0.01
    max_positions_per_sector: 1
    breadth_green_threshold: 0.50
    breadth_red_threshold: 0.25
    min_breadth_coverage_pct: 0.65
    yellow_max_positions: 1
    volume_confirmation_mode: "pace"
    volume_pace_ratio: 1.8
    volume_pace_timeframe: "1Min"
    session_minutes: 390
    volume_spike_ratio: 1.8
    volume_avg_period: 20

  rsi_reversion:
    enabled: true
    asset_class: stocks
    description: "Conditional bear/chop RSI mean reversion. Entry: RSI<40, %B<20%, liquidity confirmation, 1-bar recovery, price within 15% below and 15% above SMA200, 5-day drawdown <=10%, and ATR/price <=5%. ATR stop extension: 0.8×ATR(14), capped at 6% max stop distance; the global stop governs when the ATR stop is tighter or absent. Exit: price reaches SMA20, RSI>50, 6% daily-close max-loss, or 10-day cap. Regime: stand down in bull regimes, skip severe crash (SPY >20% below 252d peak) or elevated realised-volatility proxy."
    live_readiness:
      enabled: true
      min_closed_paper_trades: 20
      min_paper_days: 60
    rsi_period: 14
    market_regime_mode: "bear_or_chop_only" # Only scan when the stock regime filter is not in bull mode.
    oversold_threshold: 40          # Entry: RSI below this level (oversold/recovering)
    overbought_threshold: 50        # Exit: RSI above this (momentum neutral = edge evaporated)
    hold_days: 10                   # Hard exit after 10 business days
    bb_period: 20                   # Bollinger Band lookback period
    bb_std: 2.0                     # Bollinger Band standard deviation multiplier
    vix_multiplier: 0.95            # HV20 must be below HV_MA × this to allow entries
    atr_period: 14                  # ATR lookback for volatility-adjusted stop
    atr_multiplier: 0.8             # Stop = entry - atr_multiplier × ATR
    max_entry_atr_pct: 0.05          # Skip legacy/high-volatility names above 5% ATR/price
    max_stop_loss_pct: 0.06          # Cap RSI-specific ATR stop extension at 6% below entry
    max_loss_exit_pct: 0.06          # Strategy fail-safe exit on daily close >=6% below entry
    profit_trailing_enabled: true    # Protect winners before the 10-business-day hold cap
    trail_activation_pct: 0.06        # Enable trailing stop once peak gain reaches 6%
    trailing_stop_pct: 0.04           # Exit if price falls 4% from post-entry peak
    risk_per_trade_pct: 0.01        # Risk 1% of equity per trade for ATR-based sizing
    sma200_lower_buffer_pct: 0.15   # Entry blocked if price < SMA200 × (1 - this); prevents buying broken stocks
    sma200_upper_buffer_pct: 0.15   # Entry blocked if price > SMA200 × (1 + this); prevents buying overextended stocks
    volume_spike_ratio: 0.7         # Entry bar volume must exceed this multiple of the 20-day average
    min_recovery_bars: 1            # Require this many consecutive improving closes before entry
    min_recovery_pct: 0.0           # Each recovery close must improve by more than this percentage
    min_close_location: 0.0         # Optional close-location gate; 0 disables it
    recent_drawdown_lookback_days: 5 # Drawdown window used to avoid unresolved waterfalls
    max_recent_drawdown_pct: 0.10   # Skip entries still more than 10% below the recent 5-day peak
    profit_floor_pct: 0.015         # Exit via SMA target must exceed entry × (1 + this) to cover slippage
    weight: 1.0

  gap_up:
    enabled: false
    asset_class: stocks
    description: "Disabled in the default profile until standalone bootstrap and minute-fill validation improve; buys confirmed true-gap stocks gapping up 5-15% with opening-volume pace, completed-bar trend confirmation, and failed-gap exits"
    min_gap_pct: 0.05            # Minimum gap-up percentage
    max_gap_pct: 0.15            # Avoid buying exhaustion gaps beyond this percentage
    require_true_gap: true       # Today's open must also clear the prior day's high
    volume_multiplier: 1.3       # Opening volume pace must be 1.3x the 20-day average daily pace
    volume_avg_period: 20        # Lookback for average volume confirmation
    min_breadth_pct: 0.65         # Require at least 65% of scan universe above SMA50
    trend_sma_period: 200        # Use completed closes only; current bar close is not known at entry
    require_prior_close_above_trend: true # Prior completed close must already be above SMA200
    max_trend_extension_pct: 0.35 # Avoid exhaustion gaps more than 35% above the trend SMA
    entry_window_minutes: 45     # Only enter within first 45 min of market open
    intraday_exit: false         # Respect intraday.enabled setting above
    hold_days: 2
    timeframe: "1Day"
    opening_timeframe: "1Min"
    session_minutes: 390
    max_open_extension_pct: 0.03 # Avoid chasing names already >3% above the session open
    max_open_fade_pct: 0.005     # Skip if price has already faded >0.5% below the session open
    max_signals: 1               # Take only the top-ranked opening gap per scan to avoid clustered event risk
    atr_period: 14
    atr_multiplier: 2.0
    risk_per_trade_pct: 0.01
    breakdown_exit_pct: 0.03     # Failed-gap exit if close falls 3% below entry
    trend_exit_enabled: true     # Exit if completed close loses the SMA trend filter
    weight: 0.8

  capitol_copy:
    enabled: false
    asset_class: stocks
    description: "HawksCapitol signal adapter. Consumes scored congressional copy-buy signals from the HawksCapitol submodule; HawksCapitol owns ingestion/scoring, HawksTrade owns execution/risk/exits."
    signal_path: "integrations/HawksCapitol/data/signals/latest.json"
    max_signal_age_hours: 72
    require_created_at: true
    allowed_asset_types: ["stock"]
    respect_scan_universe: false
    allowed_symbols: []
    min_conviction_score: 0.65
    min_freshness_score: 0.35
    min_entry_quality_score: 0.55
    max_signals: 2
    hold_days: 10
    profit_trailing_enabled: true
    extend_winners_after_hold: true
    profit_floor_pct: 0.0
    trail_activation_pct: 0.08
    trailing_stop_pct: 0.05
    max_hold_days: 45
    weight: 0.5
    live_readiness:
      enabled: true
      min_closed_paper_trades: 20
      min_paper_days: 30

  ma_crossover:
    enabled: true
    asset_class: crypto
    description: "Enter when 6-EMA crosses above 18-EMA with slope, shallow drawdown guard, price/EMA confirmation, volatility, volume, and RSI filters. Exit on daily close max-loss, bearish cross, RSI target, or 16-day hold cap. Uses 2xATR stop extension and 1%-risk position sizing."
    live_readiness:
      enabled: true
      min_closed_paper_trades: 25
      min_paper_days: 90
    fast_ema: 6
    slow_ema: 18
    timeframe: "1Day"            # "1Hour" | "4Hour" | "1Day"
    entry_cross_lookback_days: 1  # Require the bullish cross on the latest completed daily transition
    trend_return_lookback_days: 3 # Require recent follow-through before accepting a new cross
    min_trend_return_pct: -0.02   # Block crosses after >2% 3-day drawdown
    min_price_above_slow_pct: 0.005 # Require close at least 0.5% above slow EMA to avoid underpowered crosses
    hold_days: 16
    max_loss_exit_pct: 0.02      # Strategy-level exit if latest daily close is at least 2% below entry
    atr_period: 14
    atr_multiplier: 2.0
    risk_per_trade_pct: 0.01     # Risk 1% of equity per trade for ATR-based sizing
    rsi_entry_min: 35            # RSI must be at least this to avoid entering oversold chop
    rsi_entry_max: 75            # RSI must be below this to avoid buying overbought
    rsi_exit_max: 75             # Exit if RSI rises above this (overbought target)
    volume_spike_ratio: 1.0      # Entry bar volume must exceed this multiple of the 20-day average
    volume_avg_period: 20        # Period for volume average
    vol_filter_period: 10        # Period for volatility (range) filter average
    max_signals: 1               # Avoid concentrated correlated crypto entries from the same scan
    weight: 1.0

  range_breakout:
    enabled: true
    asset_class: crypto
    description: "Enter long on confirmed daily close breakout above the configured Donchian high with volume, trend, volatility, RSI, breakout-extension, and close-location guards. Exit failed breakouts early before the hold cap."
    live_readiness:
      enabled: true
      min_closed_paper_trades: 25
      min_paper_days: 90
    breakout_lookback_days: 20   # Close must break above the prior N-day high, excluding the current bar
    breakout_pct: 0.006          # Close must break 0.6% beyond the Donchian high
    min_breakout_extension_pct: 0.008 # Require at least 0.8% follow-through above breakout level
    max_breakout_extension_pct: 0.08  # Avoid chasing closes >8% beyond the breakout level
    min_close_location: 0.90      # Require close in upper 10% of the daily range
    volume_multiplier: 2.5       # Volume must be 2.5x average to confirm breakout
    volume_avg_period: 20        # Lookback for average volume confirmation
    timeframe: "1Day"
    hold_days: 14
    atr_period: 14
    atr_multiplier: 2.0
    risk_per_trade_pct: 0.01
    vol_filter_period: 10
    min_range_ratio: 0.45        # Entry bar range must be at least 45% of recent average range
    trend_ema_period: 50         # Price must close above this EMA
    trend_slope_lookback: 5      # Trend EMA must be non-declining across this many bars
    rsi_period: 14
    rsi_entry_max: 82            # Avoid buying severely overextended breakout closes
    rsi_exit_max: 82             # Profit-taking exhaustion exit after profit floor
    profit_floor_pct: 0.03       # RSI exhaustion exit only after at least 3% open profit
    profit_trailing_enabled: true # Protect winners before the 14-day hold cap
    trail_activation_pct: 0.06   # Enable trailing stop once peak gain reaches 6%
    trailing_stop_pct: 0.04      # Exit if price falls 4% from post-entry peak
    breakdown_exit_pct: 0.02     # Exit failed breakout when close falls 2% below entry
    trend_exit_enabled: true     # Exit when completed close falls below trend EMA
    weight: 0.9

# --- VALIDATION GATES ---
# Guardrails used before scaling live capital or strategy sleeves. Sample-size
# scaling is intentionally active in live/paper/backtest order sizing.
validation:
  min_reliable_trades: 30        # Watch-only warning floor for interpreting backtest metrics.

  sample_size_scaling:
    enabled: true
    tiers:
      - { name: exploration, min_trades: 0, risk_multiplier: 0.25, position_cap_pct: 0.02 }
      - { name: half, min_trades: 30, risk_multiplier: 0.50, position_cap_pct: 0.04 }
      - { name: full, min_trades: 100, risk_multiplier: 1.00, position_cap_pct: 0.08 }
    overrides: {}

  bootstrap:
    enabled: true
    n_iter: 10000
    block_size: 5
    seed: 42
    drawdown_threshold_pct: 0.10

  cost_model:
    slippage_bps: 10.0           # Backtest gate assumes 10 bps adverse fill per side
    fee_bps: 5.0                 # Backtest gate assumes 5 bps fees/commission per side
    min_fee_usd: 0.0
    sensitivity_levels_bps: [10.0, 20.0, 30.0] # Optional validation reruns for slippage stress checks
    sensitivity_soft_min_return_pct: 0.08      # Watch-only return floor for slippage stress checks

  walkforward:
    enabled: true
    profiles:
      master:
        window_days: 180
        screener: true
        strategies: [momentum, relative_strength, rsi_reversion, ma_crossover, range_breakout]
        windows:
          - end_date: "12/31/2019"
            label: calm_bull_2019
            regime: "Calm bull, low volatility"
          - end_date: "09/30/2020"
            label: covid_crash_2020
            regime: "COVID crash and V-recovery"
          - end_date: "12/31/2021"
            label: stimulus_bull_2021
            regime: "Stimulus-driven late-cycle bull"
          - end_date: "12/31/2022"
            label: tech_bear_2022
            regime: "Rate-hike technology bear market"
          - end_date: "12/31/2023"
            label: ai_reversal_2023
            regime: "SVB shock and AI-led reversal"
          - end_date: "09/30/2024"
            label: election_chop_2024
            regime: "Pre-election range-bound chop"
          - end_date: auto
            auto_offset_days: 60
            label: current_regime_auto
            regime: "Current regime excluding locked OOS"
        cost_levels:
          - { name: baseline, slippage_bps: 7.5, fee_bps: 5.0, min_fee_usd: 0.0 }
          - { name: stressed, slippage_bps: 15.0, fee_bps: 5.0, min_fee_usd: 0.0 }
          - { name: severe, slippage_bps: 25.0, fee_bps: 5.0, min_fee_usd: 0.0 }
        thresholds:
          baseline: { min_return_pct: 0.04, max_drawdown_pct: 0.08, min_profit_factor: 1.20, min_trades: 25, min_daily_sharpe: 0.50 }
          stressed: { min_return_pct: 0.00, max_drawdown_pct: 0.10, min_profit_factor: 1.00, min_trades: 25, min_daily_sharpe: 0.20 }
          severe: { min_return_pct: -0.02, max_drawdown_pct: 0.12, min_profit_factor: 0.90, min_trades: 25 }
        pass_rate:
          baseline: 0.80
          stressed: 0.66
          severe: 0.50
        blocking_levels: [stressed] # Baseline/severe are diagnostic; stressed is the capital-scaling gate.
        oos_lock:
          label: locked_oos_recent_60d
          regime: "Locked most-recent OOS validation window"
          window_days: 60
          end_date: auto
          auto_offset_days: 2
          must_pass_at: stressed
          scale_min_trades_to_window: true # Scale 25 trades / 180d to the shorter 60d OOS window.
        regression_issue:
          auto_file: true
          title: "Walk-forward stressed pass rate below capital-scaling threshold"
      quick:
        window_days: 180
        screener: true
        strategies: [momentum, relative_strength, rsi_reversion, ma_crossover, range_breakout]
        windows:
          - end_date: "09/30/2020"
            label: covid_crash_2020
            regime: "COVID crash and V-recovery"
          - end_date: "12/31/2022"
            label: tech_bear_2022
            regime: "Rate-hike technology bear market"
          - end_date: auto
            auto_offset_days: 60
            label: current_regime_auto
            regime: "Current regime excluding locked OOS"
        cost_levels:
          - { name: stressed, slippage_bps: 15.0, fee_bps: 5.0, min_fee_usd: 0.0 }
        thresholds:
          stressed: { min_return_pct: 0.00, max_drawdown_pct: 0.10, min_profit_factor: 1.00, min_trades: 25, min_daily_sharpe: 0.20 }
        pass_rate:
          stressed: 0.66
        blocking_levels: [stressed]
        oos_lock:
          label: locked_oos_recent_60d
          regime: "Locked most-recent OOS validation window"
          window_days: 60
          end_date: auto
          auto_offset_days: 2
          must_pass_at: stressed
          scale_min_trades_to_window: true
        regression_issue:
